name: Release

# After CI passes on main: when the tag v<version> (Cargo.toml) has no published
# release yet, build the packages and publish it. A published release is never
# overwritten: a fix is a new version. Run by hand, it only builds the packages
# (artifacts, no release). See packaging/RELEASING.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_ABOUT_VERSION: 0.9.3

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          version=$(packaging/version.sh)
          release=false
          if [ "${{ github.event_name }}" = workflow_run ]; then
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" \
                --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
              echo "v$version is already published: tests only"
            else
              release=true
              packaging/notes.sh "$version" >/dev/null
            fi
          fi
          prerelease=false
          case $version in *-*) prerelease=true ;; esac
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "release=$release"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
          echo "version $version at $sha, release: $release" >>"$GITHUB_STEP_SUMMARY"

  licences:
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: cargo-about
        run: cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      - name: THIRD-PARTY.txt
        run: packaging/licences.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party
          path: dist/THIRD-PARTY.txt
          if-no-files-found: error

  linux:
    needs: [plan, licences]
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    # The oldest Ubuntu runner: the binary needs glibc >= 2.35.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party
          path: dist
      - name: Build
        run: cargo build --release --locked -p raft
      - name: Package
        run: packaging/linux.sh
      - name: Check the packages
        run: packaging/check.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  publish:
    needs: [plan, linux]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          tag="v$VERSION"
          packaging/notes.sh "$VERSION" >notes.md
          (cd dist && sha256sum -- * >SHA256SUMS.txt && cat SHA256SUMS.txt)
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          # A draft left by a failed run is replaced; a published release never is.
          if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --draft --target "$SHA" --title "Raft $VERSION" \
            --notes-file notes.md "${flags[@]}" dist/*
          gh release edit "$tag" --draft=false
